<style>

:root[data-theme="dark"]{--bg:#07201b;--panel:#0f2f27;--ink:#efeadc;--mu:#9bb5aa;--line:#1f4a3e;--rs:#ff8d83;--brass:#d5ad55;--hint:rgba(255,255,255,.05)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;min-height:100dvh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
.serif,h1,.status,.brand,.hb,.ac,.lv button,.st button,.cd,.rv .h{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}

.mu{color:var(--mu);font-size:14px}
.red{color:var(--rs)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.status{font-size:21px;font-weight:600;margin:0 0 10px}

@media (max-width:860px){.main{grid-template-columns:1fr}}
.table{border-radius:30px;background:radial-gradient(120% 110% at 50% 38%,var(--fa),var(--fb));box-shadow:inset 0 0 0 2px rgba(213,173,85,.6),inset 0 0 0 10px rgba(0,0,0,.18),0 14px 32px rgba(0,0,0,.25);padding:22px;min-height:580px;display:grid;grid-template-columns:104px 1fr 104px;grid-template-rows:auto 1fr auto;gap:10px;color:#f1ecdc}

.dl{display:inline-block;margin-left:6px;background:#d5ad55;color:#1b1608;border-radius:6px;padding:0 6px;font-weight:700;font-size:12px}

.eh b{display:block;margin-bottom:2px}.table .hand div{font-size:15px;white-space:nowrap}
.side{display:flex;flex-direction:column;gap:12px}

.card p{margin:4px 0}
.ascroll{max-height:250px;overflow:auto}
.aud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.ah{font-size:13px;color:var(--mu);padding-bottom:4px;border-bottom:2px solid var(--line)}.ah.us{border-bottom-color:var(--brass);color:var(--ink);font-weight:600}

.lv{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.st{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}.ops{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:8px}

.lv button.on,.st button.on{background:var(--fa);color:#fff;border-color:var(--fa)}.st button.on .red{color:#ffb3ab}
.st .nt{font-size:23px;font-weight:700}

.ops [data-o="P"]{background:#2e8b57}.ops [data-o="X"]{background:#c0392b}.ops [data-o="XX"]{background:#2c6fb0}

.rv.ok{border-left-color:#2e8b57;background:rgba(46,139,87,.13)}.rv.fel{border-left-color:#d24a3a;background:rgba(210,74,58,.14)}.rv.mid{border-left-color:#c9962b;background:rgba(201,150,43,.15)}
.hero{max-width:1000px;margin:0 auto;padding:30px 22px;width:100%}
.hero h1{font-size:46px;margin:0 0 4px;font-weight:600}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode,.seatpick{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:20px;min-height:120px;border-radius:20px;color:var(--ink);background:var(--panel);border:2px solid var(--line)}.mode.on,.seatpick.on{color:#f4efe0;border-color:transparent;background:linear-gradient(150deg,var(--fa),var(--fb));box-shadow:inset 0 0 0 2px rgba(213,173,85,.5)}
.mode b,.seatpick b{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:26px}
.mode span,.seatpick span{opacity:.85;font-size:15px}
.foc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ft{min-height:52px;text-align:left;line-height:1.25}.ft.on{background:var(--fa);color:#fff;border-color:var(--fa);font-weight:600}
.hero .card{margin-top:14px}
@media (max-width:700px){.modes{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
var SU=['C','D','H','S','N'],SYM={C:'♣',D:'♦',H:'♥',S:'♠',N:'NT'},RK={14:'E',13:'K',12:'D',11:'Kn',10:'T'};
var SEATS=['N','E','S','W'],NAME={N:'Norr',E:'Öst',S:'Syd',W:'Väst'};
var app=document.getElementById('app');
var lastSeat=null,modeSel='stord',state=null,seat=null,pick=null,loaded=true,busy=false,rng=Math.random;
try{seat=localStorage.getItem('bt_seat')}catch(e){}
try{showHp=localStorage.getItem('bt_hp')==='1'}catch(e){}

var REF="REGLER (enda källan – Nordisk standard 2012-08-22). Förkortningar: lå=♣/♦, hö=♥/♠, hp: E4 K3 D2 Kn1; stödpoäng vid stöd eller egen 6+färg/5-5: renons 3, singel 2, dubbelton 1; htp=hp+stp. Balanserad hand: 4333, 4432, 5332.\n"+
"ÖPPNING: 1 i färg 12-19 hp, 4+färg (11 hp om bra 5+färg). 1NT 15-17 hp balanserad (även 5hö332). 2♣ utgångskrav eller 22-24 balanserad. 2♦/2♥/2♠ 6-10 hp exakt 6-korts färg (med 11 hp och 6-färg öppna 1 i färgen). 2NT 20-21 balanserad. 3 i färg spärr 6-10 hp 7-kort. 4 i färg spärr 8-kort. Färgval: längsta färgen; två 5-kort: högsta; två eller tre 4-kort: lägsta.\n"+
"SVAR PÅ 1 I FÄRG: 1NT 6-10 hp, förnekar 4-korts stöd och 4-korts färg på 1-nivå. 1 över 1: 6+ hp 4+färg rondkrav. 2 över 1: 11+ hp 4+färg rondkrav. Stöd 4+ i lå: 2 lå 6-9 htp, 3 lå 10-12 htp, 4 lå spärr max 9 htp, 2NT 13+ htp Stenberg utgångskrav. Stöd 4+ i hö: 2 hö 6-9, 3 hö 10-12, 4 hö spärr max 12, 2NT 13+ Stenberg. Dubbelhopp i ny färg: renons i färgen, 4+stöd, 13+ htp. Har man stöd i lå och 4+hö bjuds högfärg först. Högfärgsstöd visas alltid.\n"+
"STENBERG 2NT i hö (ÖH): 3 hö extra styrka 15+ htp ingen singel; 3 lå singel i den bjudna lågfärgen; 3 andra hö singel i andra högfärgen; 3NT 12-14 hp balanserad. Stenberg i lå: 3 lå 15+ htp ingen singel; 3 andra lå singel i andra lågfärgen; 3 hö singel i högfärgen; 3NT 12-14 balanserad.\n"+
"ÖPPNINGSHANDENS ANDRA BUD: trumfstöd 4+: lägsta höjning 12-16 htp, enkelhopp 17-19, hopp till utgång 20+. Egen 6+färg utan sidofärg: lägsta nivå 12-16, enkelhopp 17-19, hopp till utgång (hö) 20+. Balanserad: NT på lägsta nivå 12-14 (bjöd partnern 1NT passar man), hopp i NT 18-19. Tvåfärgshand: andra färgen på lägsta nivå 12-17 om bara 5-4 (svarshanden får passa med 6-7 hp och stöd); hopp i andra färgen 18+ htp minst 5-4; stigande (reverse) budgivning 18+ och minst 5-4. Efter 1 hö–2 hö: 3 hö 17-19 htp naturlig invit utan singel; ny färg 17-19 htp med singel i bjuden färg.\n"+
"FORTSATT BUDGIVNING: ny färg är krav en rond (utgångskrav om på 3-nivå). Fjärde färg söker håll i den bjudna färgen. Undantag: svarshandens färg på lägsta nivå efter att ha bjudit 1NT är ej krav (6-9 hp, 6+färg).\n"+
"ÖPPNING 2♦/2♥/2♠ (6-10 hp, 6-kort): ny färg 5+ krav till minst 3 i öppningsfärgen; 3 i öppningsfärgen spärrhöjning 3+stöd ej invit; 3NT slutbud; hopp renons slaminvit; 2NT invit med 2+stöd; ombudsbud på 3-nivå 6-8 hp; 3NT/4 hö 9-10 hp.\n"+
"ÖPPNING 1NT (15-17): 2♣ Stayman (fråga efter 4-korts hö, bör ha egen 4-hö); 2♦ överföring ♥ (5+); 2♥ överföring ♠ (5+); 2♠ dåliga kort 6+lå (vill spela 3 lå, ÖH bjuder 2NT eller 3♣ efter längd); 2NT naturlig invit balanserad utan 4-korts hö; 3 lå invit bra 6+lå; 3NT slutbud. Svar på Stayman: 2♦ ingen 4+hö; 2♥ 4-5 korts ♥ (kan ha 4-4 i hö); 2♠ 4-5 korts ♠. Efter Stayman: 2NT och 3 i ÖH:s hö är invit; ny färg ukrav naturligt (5+hö eller 4+lå); med utgångsstyrka och 5-hö obalanserad bjuds 2♣ och sedan 3 hö. Efter överföring (2♦→2♥): pass dåliga kort 5+♥; 2NT invit jämn exakt 5♥; 3♥ invit 6+; 2♠ rondkrav 5♥+4♠; 3 lå ukrav 5♥+4+lå; 3NT välj utgång jämn exakt 5♥; 4 lå kontroll/slamintresse; 4♥ slutbud; 4NT RKC. Samma för ♠. Överföring: ÖH bjuder färgen nästan alltid (3 i färgen med max och 4+stöd). Efter motståndarbud över 1NT gäller inte Stayman/överföring: ny färg på 2-nivå naturlig invit 5+, på 3-nivå utgångskrav 5+; dubbling upplysning (minst invit, 3+ i objudna).\n"+
"ÖPPNING 2NT (20-21 balanserad; 22-24/25-27 via 2♣): som efter 1NT en nivå högre (3♣ Stayman, 3♦/3♥ överföringar, 3NT slutbud).\n"+
"ÖPPNING 2♣ (utgångskrav eller minst 22 balanserad): svar 2 hö = 6+hp bra 5+hö; 3 lå = 6+hp bra 6+lå; 2♦ om handen inte passar (variant: alltid 2♦). Efter 2♣–2♦: 2 hö ukrav 5+hö; 2NT 22-24 jämn; 3 lå ukrav 5+lå; 3NT 25-27 jämn. Efter 2♣–2 hö/3 lå: närmsta bud 0-5 hp och ej trumfstöd (Herbertavslag); 3 hö 6+hp och 3+stöd; 4 hö 0-5 hp stöldvärde 4+stöd; ny färg 6+hp 5+färg; 3NT 6+hp jämn.\n"+
"SLAM: RKC 4NT med trumf fastställd: 5♣ 0 eller 3 ess (av 5), 5♦ 1 eller 4, 5♥ 2 ess utan trumfdam, 5♠ 2 ess med trumfdam, 5NT 3 ess och renons. Ej fastställd trumf (4 ess): 5♣ 0 eller 4, 5♦ 1, 5♥ 2, 5♠ 3. Kontrollbud: ny färg på 4-nivå efter fastställd trumf visar slamintresse och kontroll (E/K eller renons/singel).\n"+
"INKLIV: enkelt inkliv 12-17 hp (inkliv 1 hö: 10+hp och bra 5+färg). 1NT-inkliv 15-17 med håll i öppningsfärgen. Hoppande inkliv 6-10 hp 6+färg. Svar på inkliv: 1NT 8-10 balanserad med håll; 2NT 11-13 bra håll; 3NT 14+ bra håll; enkel höjning 6-9 hp 3-kort stöd; dubbel höjning 6-9 4-kort; trippel höjning 6-9 5-kort; ny färg 8+ 5+färg rondkrav (10+ om 2-nivå); hopp i ny färg 14+ bra 6+färg utgångskrav; överbud (deras färg) 10+ hp 3+stöd. Hoppinkliv 2 hö: 6-10 hp bra 6-kort, fortsättning som efter öppning 2 hö.\n"+
"UPPLYSNINGSDUBBLING (D): 12+ hp och minst 3 kort i objudna färger, eller 17+ alla fördelningar. Utan stöd som bjuder egen färg/NT efter dubbling: 18+ hp. Svar: 1NT 6-9 hp håll i öppningsfärgen; 2NT 10-12 håll; 3NT 13+ håll; färg på lägsta nivå 0-7 hp (i värsta fall 3-kort); hopp i färg 8-9 htp 4+färg; hopp till 3-läget 10-12 htp helst 5+färg; överbud 10+ hp krav; pass bara med många kort i öppningsfärgen. Försvar mot spärröppningar (2 och högre): D = UD eller 17+ hp; 2NT 16-18 balanserad; överbud = hållfråga.";

function side(s){return s==='N'||s==='S'?0:1}
function isBot(s){return s==='E'||s==='W'}
function partner(s){return SEATS[(SEATS.indexOf(s)+2)%4]}
function rank(c){return (+c[0])*5+SU.indexOf(c[1])}
function isBid(c){return c!=='P'&&c!=='X'&&c!=='XX'}
function txt(c){return c==='P'?'Pass':c==='X'||c==='XX'?c:c[0]+SYM[c[1]]}
function fmt(c){if(c==='P')return 'Pass';if(!isBid(c))return c;var s=c[1];return '<span class="'+(s==='H'||s==='D'?'red':'')+'">'+c[0]+SYM[s]+'</span>'}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m]})}
function shuffleDeal(){
  var d=[],i,j,s=['S','H','D','C'];
  for(i=0;i<4;i++)for(j=2;j<=14;j++)d.push(s[i]+j);
  for(i=d.length-1;i>0;i--){j=Math.floor(rng()*(i+1));var t=d[i];d[i]=d[j];d[j]=t}
  return {N:d.slice(0,13),E:d.slice(13,26),S:d.slice(26,39),W:d.slice(39)};
}
function turn(st){return SEATS[(SEATS.indexOf(st.dealer)+st.bids.length)%4]}
function ctx(st){
  var r={lb:null,lbS:null,dbl:0,dblS:null};
  st.bids.forEach(function(b){
    if(isBid(b.c)){r.lb=b.c;r.lbS=b.s;r.dbl=0;r.dblS=null}
    else if(b.c==='X'){r.dbl=1;r.dblS=b.s}
    else if(b.c==='XX'){r.dbl=2}
  });
  return r;
}
function ended(st){
  var b=st.bids;if(!b.length)return false;
  var any=b.some(function(x){return x.c!=='P'});
  if(!any)return b.length>=4;
  return b.length>=4&&b.slice(-3).every(function(x){return x.c==='P'});
}
function legal(st,c,s){
  var x=ctx(st);
  if(c==='P')return true;
  if(c==='X')return !!x.lb&&x.dbl===0&&side(x.lbS)!==side(s);
  if(c==='XX')return x.dbl===1&&side(x.dblS)!==side(s);
  return !x.lb||rank(c)>rank(x.lb);
}
function hpOf(h){var p=0;h.forEach(function(k){var n=+k.slice(1);if(n>=11)p+=n-10});return p}
function maxLen(h){var L={S:0,H:0,D:0,C:0};h.forEach(function(k){L[k[0]]++});return Math.max(L.S,L.H,L.D,L.C)}
function nsOk(d){var a=hpOf(d.N),b=hpOf(d.S);return a+b>=22&&Math.max(a,b)>=12}
function oppClear(h){var p=hpOf(h),m=maxLen(h);return (p>=12&&m>=5)||(p>=6&&p<=10&&m>=6)}
function oppBorder(h){var p=hpOf(h);return p>=10&&p<=11&&maxLen(h)>=5}
var FOC=[['alla','Alla slags givar'],['nt','1NT, Stayman och överföringar'],['stenberg','Stenberg 2NT (stöd i hög- och lågfärg)'],['tva','2♣-öppning (starka givar)'],['rkc','RKC (essfråga i högfärg)'],['slam','Slambudgivning (kontrollbud och RKC)'],['trumf','Trumfstöd (stödbud i färg)'],['sang','Sanghänder (1NT/2NT och svar)'],['invit','Inviter (invit eller utgång)'],['tvafarg','Tvåfärgshänder (andra bud)'],['svag','Svaga öppningar och spärrbud'],['dubbling','Upplysningsdubbling (dubbla och svara, alltid störd)'],['inkliv','Inkliv och dubbling (störd)']];
function focLabel(f){for(var i=0;i<FOC.length;i++)if(FOC[i][0]===f)return FOC[i][1];return ''}
function shapeOf(h){var L={S:0,H:0,D:0,C:0};h.forEach(function(k){L[k[0]]++});return L}
function isBal(L){var s=[L.S,L.H,L.D,L.C].sort(function(a,b){return b-a}).join('');return s==='4333'||s==='4432'||s==='5332'}
function htpWith(h,su){var L=shapeOf(h),t=hpOf(h);['S','H','D','C'].forEach(function(x){if(x!==su){var n=L[x];t+=n===0?3:n===1?2:n===2?1:0}});return t}
function focusOk(d,f){
  var pr=[['N','S'],['S','N']],i,a,b,La,Lb,M;
  if(f==='tva')return hpOf(d.N)>=22||hpOf(d.S)>=22;
  function anyP(fn){return fn(d.N,d.S)||fn(d.S,d.N)}

  for(i=st.bids.length-1;i>=0;i--)if(!isBot(st.bids[i].s))break;
  if(i<0||(seat!=='X'&&st.bids[i].s!==seat))return;
  clr();save({id:st.id,seed:st.seed,no:st.no,mode:st.mode,focus:st.focus,hands:st.hands,dealer:st.dealer,bids:st.bids.slice(0,i),review:null,rep:st.rep||0});
}
function hpInfo(h){
  var L=shapeOf(h);
  return hpOf(h)+' hp · '+[L.S,L.H,L.D,L.C].sort(function(a,b){return b-a}).join('-')+(isBal(L)?' · balanserad':' · obalanserad');
}
function setSel(m,f){modeSel=m;focusSel=f;if(!state||!state.hands){state=state||{menu:true,no:0};rev++;send({v:rev,from:sender,st:pack(state)})}}
function setSeat(s){if(s===null&&seat)lastSeat=seat;seat=s;clr();try{if(s)localStorage.setItem('bt_seat',s);else localStorage.removeItem('bt_seat')}catch(e){}render()}

var pickL=null,pickS=null,pickO=null;
function clr(){pickL=null;pickS=null;pickO=null;hintText=''}
function curPick(){return pickO||(pickL&&pickS?pickL+pickS:null)}
function oppList(st){
  var l=st.bids.filter(function(b){return side(b.s)===1&&b.c!=='P'&&b.e});
  if(!l.length)return '';
  return '<p class="mu" style="margin:10px 0 2px"><b>Motståndarnas bud (robotens avsikt)</b></p>'+l.map(function(b){return '<p style="margin:2px 0">'+NAME[b.s]+' '+fmt(b.c)+' – '+esc(b.e)+'</p>'}).join('');
}
function fanHtml(cards){
  var o='';
  ['S','H','C','D'].forEach(function(s){
    cards.filter(function(c){return c[0]===s}).map(function(c){return +c.slice(1)}).sort(function(a,b){return b-a}).forEach(function(n){
      o+='<div class="cd'+(s==='H'||s==='D'?' r':'')+'" data-s="'+SYM[s]+'"><b>'+(RK[n]||n)+'</b><i>'+SYM[s]+'</i></div>';
    });
  });
  return '<div class="fan">'+o+'</div>';
}
function seatHtml(st,s,rel){
  var lc=null;st.bids.forEach(function(b){if(b.s===s)lc=b.c});
  return '<div class="seat'+(!ended(st)&&turn(st)===s?' turn':'')+'"><span class="nm">'+NAME[s]+(s===st.dealer?'<span class="dl">D</span>':'')+'</span><small>'+rel+'</small><span class="bks">'+new Array(14).join('<i class="bk"></i>')+'</span><span class="lc">'+(lc?fmt(lc):'&nbsp;')+'</span></div>';
}
function endHand(st,s){return '<div class="eh'+(side(s)===0?' us':'')+'"><b>'+NAME[s]+'</b>'+handHtml(st.hands[s])+'</div>'}
function handBlock(st,me){
  return '<div class="row"><span class="nm">'+NAME[me]+(seat==='X'?' · på tur':' · du')+'</span>'+(me===st.dealer?'<span class="dl" style="margin:0">D</span>':'')+'</div>'+fanHtml(st.hands[me])+'<div class="row"><button id="hpb" class="sm ghost">'+(showHp?'Dölj poäng':'Visa poäng')+'</button>'+(showHp?'<span class="chip" style="background:rgba(0,0,0,.28);color:#f1ecdc;border-color:rgba(255,255,255,.2)">'+hpInfo(st.hands[me])+'</span>':'')+'</div>';
}
function render(){
  if(!room){roomScreen();return}
  if(!seat){
    app.innerHTML='<div class="hero"><h1>Budträning</h1><p class="mu">Nordisk standard. Vem sitter vid den här enheten?</p><div class="modes" style="margin-top:18px"><button id="sN" class="seatpick'+(lastSeat==='N'?' on':'')+'"><b>Norr</b><span>Du spelar Norr på den här enheten.</span></button><button id="sS" class="seatpick'+(lastSeat==='S'?' on':'')+'"><b>Syd</b><span>Du spelar Syd på den här enheten.</span></button></div><div style="margin-top:14px"><button id="sX" class="seatpick'+(lastSeat==='X'?' on':'')+'" style="width:100%;min-height:90px"><b>Båda på en enhet</b><span>Du spelar både Norr och Syd på den här enheten.</span></button></div></div>';
    document.getElementById('sN').onclick=function(){setSeat('N')};
    document.getElementById('sS').onclick=function(){setSeat('S')};
    document.getElementById('sX').onclick=function(){setSeat('X')};
    return;
  }
  if(!state||!state.hands){
    app.innerHTML='<div class="hero"><h1>Budträning</h1><p class="mu">Nordisk standard</p><p class="status" style="margin-top:20px">Välj budgivning</p><div class="modes"><button id="m1" class="mode'+(modeSel==='stord'?' on':'')+'"><b>Störd budgivning</b><span>Öst och Väst lägger sig i. Träna inkliv, dubbling och spärr.</span></button><button id="m2" class="mode'+(modeSel==='ostord'?' on':'')+'"><b>Ostörd budgivning</b><span>Motståndarna passar. Träna ert eget system.</span></button></div><p class="status" style="margin-top:24px">Vad vill ni träna?</p><div class="foc">'+FOC.map(function(f){return '<button class="ft'+(f[0]===focusSel?' on':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>'}).join('')+'</div><div style="margin-top:16px"><button id="go2" class="pri" style="width:100%;min-height:60px;font-size:20px">Starta träning</button></div>'+savedHtml()+'<div class="row" style="margin-top:14px"><button id="sw" class="sm">Byt plats</button><button id="rm" class="sm">Byt rum</button></div></div>';
    var no=(state&&state.no)||0;
    var b1=document.getElementById('m1'),b2=document.getElementById('m2');
    b1.onclick=function(){setSel('stord',focusSel);b1.classList.add('on');b2.classList.remove('on')};
    document.getElementById('go2').onclick=function(){clr();save(newDeal(no+1,modeSel,focusSel,newSeed()))};
    b2.onclick=function(){setSel('ostord',focusSel);b2.classList.add('on');b1.classList.remove('on')};
    document.getElementById('sw').onclick=function(){setSeat(null)};
    document.getElementById('rm').onclick=function(){room='';try{localStorage.removeItem('bt_room')}catch(e){}if(es)es.close();connState='offline';render()};
    Array.prototype.forEach.call(app.querySelectorAll('[data-f]'),function(b){b.onclick=function(){setSel(modeSel,b.getAttribute('data-f'));Array.prototype.forEach.call(app.querySelectorAll('[data-f]'),function(c){c.classList.toggle('on',c===b)})}});
    attachSaved();
    return;
  }
  var st=state,me=mySeat(st),end=ended(st),t=turn(st),mine=!end&&t===me;
  var base=seat==='X'?'S':me,ix=SEATS.indexOf(base),pos={l:SEATS[(ix+1)%4],t:SEATS[(ix+2)%4],r:SEATS[(ix+3)%4]},x=ctx(st);
  function rel(s){return s===partner(me)?'Partner':'Motstånd'}
  var h='<header class="bar"><div class="brand"><b>♠</b>Budträning</div><div class="row"><span class="chip hi">Giv '+st.no+(st.rep?' · omspel':'')+'</span><span class="chip">'+(st.mode==='ostord'?'Ostörd':'Störd')+'</span>'+(st.focus&&st.focus!=='alla'?'<span class="chip">'+focLabel(st.focus)+'</span>':'')+'<span class="chip">'+(seat==='X'?'En enhet':'Du är '+NAME[me])+'</span><span class="chip">'+connLabel()+'</span></div><div class="row"><button id="sv" class="sm">'+(savedFlag?'Sparad ✓':'Spara given')+'</button><button id="md" class="sm">Byt tema</button><button id="sw" class="sm">Byt plats</button><button id="cpb" class="sm">Spelkod</button><button id="fsb" class="sm">Helskärm</button></div></header><main class="main">';
  var hbx=x.lb?'<div class="hb">'+fmt(x.lb)+(x.dbl===1?' <small>X</small>':x.dbl===2?' <small>XX</small>':'')+'</div><div class="hl">'+(end?'Slutkontrakt · ':'Högsta bud · ')+NAME[x.lbS]+'</div>':'<div class="hl">'+(end?'Alla passade':'Ingen har bjudit än')+'</div>';
  if(end){
    h+='<section class="table end"><div class="seatT">'+endHand(st,pos.t)+'</div><div class="seatL">'+endHand(st,pos.l)+'</div><div class="center">'+hbx+'</div><div class="seatR">'+endHand(st,pos.r)+'</div><div class="mine">'+endHand(st,base)+'</div></section>';
  }else{
    h+='<section class="table"><div class="seatT">'+(pos.t===me?handBlock(st,me):seatHtml(st,pos.t,rel(pos.t)))+'</div><div class="seatL">'+seatHtml(st,pos.l,rel(pos.l))+'</div><div class="center">'+hbx+'</div><div class="seatR">'+seatHtml(st,pos.r,rel(pos.r))+'</div><div class="mine">'+(base===me?handBlock(st,me):seatHtml(st,base,rel(base)))+'</div></section>';
  }
  h+='<aside class="side"><div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><p class="status" style="margin:0">Budgivning</p>'+(canUndo(st)?'<button id="undo" class="sm">Ångra mitt senaste bud</button>':'')+'</div><div class="ascroll">'+auctionHtml(st,end)+'</div></div>';
  if(end){
    h+='<div class="card"><p class="status">'+contractText(st)+'</p>'+oppList(st)+'<div class="row" style="margin-top:12px"><button id="rp">Spela om given</button><button id="nd" class="pri">Ny giv</button></div></div>'+reviewHtml(st);
  }else if(mine){
    h+='<div class="card"><p class="status">'+(seat==='X'?NAME[me]+' bjuder':'Din tur att bjuda')+'</p><div class="lv">';
    for(var l=1;l<=7;l++){var okL=SU.some(function(s){return legal(st,l+s,me)});h+='<button data-l="'+l+'" '+(okL?'':'disabled ')+(pickL===l?'class="on"':'')+'>'+l+'</button>'}
    h+='</div><div class="st">';
    SU.forEach(function(s){var okS=pickL?legal(st,pickL+s,me):true;h+='<button data-s="'+s+'" '+(okS?'':'disabled ')+(pickS===s?'class="on"':'')+'><span class="'+(s==='H'||s==='D'?'red':'')+(s==='N'?' nt':'')+'">'+SYM[s]+'</span></button>'});
    h+='</div><div class="ops"><button data-o="P">Pass</button><button data-o="X" '+(legal(st,'X',me)?'':'disabled')+'>X</button><button data-o="XX" '+(legal(st,'XX',me)?'':'disabled')+'>XX</button></div></div>';
  }else{
    h+='<div class="card wait"><p class="status">Väntar på '+NAME[t]+'</p><p class="mu">Budet visas här så fort det är lagt.</p></div>';
  }
  h+='</aside></main>';
  app.innerHTML=h;
  document.getElementById('sw').onclick=function(){setSeat(null)};
  var cb=document.getElementById('cpb');if(cb)cb.onclick=function(){var c=makeCode();try{navigator.clipboard.writeText(c)}catch(e){}var q=prompt('Din spelkod är kopierad. Klistra in partnerns kod här för att synka manuellt (lämna tomt för att avbryta):','');if(q&&!applyCode(q))alert('Koden gick inte att läsa.')};
  var xb=document.getElementById('xp');if(xb)xb.onclick=function(){copyText(reviewPrompt(st))};
  var fb=document.getElementById('fsb');if(fb)fb.onclick=function(){try{var d=document.documentElement;if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}}catch(e){}};
  document.getElementById('md').onclick=function(){clr();setSel(st.mode||'stord',st.focus||'alla');save({menu:true,no:st.no})};
  document.getElementById('sv').onclick=saveDeal;
  var hb=document.getElementById('hpb');if(hb)hb.onclick=function(){showHp=!showHp;try{localStorage.setItem('bt_hp',showHp?'1':'0')}catch(e){}render()};
  var un=document.getElementById('undo');if(un)un.onclick=undoBid;
  var nd=document.getElementById('nd');if(nd)nd.onclick=function(){clr();save(newDeal(st.no+1,st.mode,st.focus,newSeed()))};
  var rp=document.getElementById('rp');if(rp)rp.onclick=function(){clr();save(replay(st))};
  Array.prototype.forEach.call(app.querySelectorAll('[data-l]'),function(b){
    b.onclick=function(){pickL=+b.getAttribute('data-l');pickO=null;if(pickS&&!legal(st,pickL+pickS,me))pickS=null;if(pickS){submitCall(st,me,pickL+pickS);return}render()};
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-s]'),function(b){
    b.onclick=function(){pickS=b.getAttribute('data-s');pickO=null;if(pickL&&!legal(st,pickL+pickS,me))pickL=null;if(pickL){submitCall(st,me,pickL+pickS);return}render()};
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-o]'),function(b){
    b.onclick=function(){var o=b.getAttribute('data-o');if(legal(st,o,me)){submitCall(st,me,o);return}pickO=o;pickL=null;pickS=null;render()};
  });
  var go=document.getElementById('go');
  if(go)go.onclick=function(){
    var c=curPick();if(!c||!legal(st,c,me))return;
    var nb=st.bids.concat([{s:me,c:c}]);clr();
    save(advance({id:st.id,seed:st.seed,no:st.no,mode:st.mode,focus:st.focus,hands:st.hands,dealer:st.dealer,bids:nb,review:null,rep:st.rep||0}));
    
  };
}

if(room)connect();
render();
})();
</script>
</body>
</html>
